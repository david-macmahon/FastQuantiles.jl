name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always clean.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # nightly is allowed to fail
          - version: 'nightly'
            allow_failure: true
          # additional platforms for the latest stable Julia
          - version: '1'
            os: macos-latest
            arch: x64
          - version: '1'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: windows-latest
            arch: x64
    continue-on-error: ${{ matrix.allow_failure || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      # CUDA tests are gated on CUDA.functional() and self-skip on runners
      # without a GPU.
      - uses: julia-actions/julia-runtest@v1
